name: kairos

services:
  # ==========================================================
  # Aplicação
  # ==========================================================
  kairos-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kairos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      alloy:
        condition: service_started
    environment:
      # Development liga o Swagger. Em produção, troque.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-kairos};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-123456}"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      Observability__OtlpEndpoint: "http://alloy:4317"
    ports:
      - "5093:8080"

  postgres:
    image: postgres:16-alpine
    container_name: postgres-kairos
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kairos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kairos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis é só cache (EF second level cache), por isso sem volume
  redis:
    image: redis:7-alpine
    container_name: redis-kairos
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==========================================================
  # Observability: OTel Collector (Alloy) + backends + Grafana
  # ==========================================================
  alloy:
    image: grafana/alloy:v1.10.0
    container_name: alloy-kairos
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "4317:4317"   # OTLP gRPC (útil se você rodar a API pela IDE)
      - "4318:4318"   # OTLP HTTP
      - "12345:12345" # UI do Alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - tempo
      - loki
      - prometheus

  tempo:
    image: grafana/tempo:2.8.2
    container_name: tempo-kairos
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.5.3
    container_name: loki-kairos
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus-kairos
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana-kairos
    restart: unless-stopped
    environment:
      # Só para desenvolvimento local: entra direto como admin, sem login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - tempo
      - loki
      - prometheus

  # ==========================================================
  # Exporters (infra, containers, Redis, Postgres)
  # ==========================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor-kairos
    restart: unless-stopped
    privileged: true
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter-kairos
    restart: unless-stopped
    pid: host
    command:
      - '--path.rootfs=/host'
    ports:
      - "9100:9100"
    volumes:
      - '/:/host:ro,rslave'

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter-kairos
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-kairos
    restart: unless-stopped
    environment:
      # Variáveis separadas em vez de DSN: senha com caractere especial não precisa de URL-encode
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB:-kairos}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER:-postgres}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  alloy-data:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
